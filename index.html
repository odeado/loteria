<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loto Digital - Cartón y Tómbola</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<!-- Contenedor de notificaciones Toast -->
<div class="toast-container" id="toastContainer"></div>
    <h1 id="tituloApp">🎰 Loto Digital</h1>
    <div class="subtitle" id="subtituloApp">Toca una celda gris (?) para escribir un número.</div>

<!-- Pestañas -->
<div class="tabs-nav">
    <button class="tab-btn activo" id="tabCarton" onclick="cambiarVista('carton')">
        <span>🎟️</span><span>Cartón</span>
    </button>
    <button class="tab-btn" id="tabTombola" onclick="cambiarVista('tombola')">
        <span>🎰</span><span>Tómbola</span>
    </button>
</div>

<!-- ========== VISTA: CARTÓN ========== -->
<div id="vista-carton" class="vista">

<!-- Barra de acciones principal -->
<div class="barra-acciones">
    <button class="btn-accion btn-historial" onclick="abrirHistorial()">
        <span class="icono">📂</span>
        <span>Historial</span>
    </button>
    <button class="btn-accion btn-nuevo" onclick="nuevoCarton()">
        <span class="icono">✨</span>
        <span>Nuevo</span>
    </button>
    <button class="btn-accion btn-exportar" onclick="exportarJSON()">
        <span class="icono">📤</span>
        <span>Exportar</span>
    </button>
    <button class="btn-accion btn-importar" onclick="document.getElementById('inputImportar').click()">
        <span class="icono">📥</span>
        <span>Importar</span>
    </button>
    <input type="file" id="inputImportar" accept=".json" style="display:none;" onchange="importarJSON(event)">
</div>

<!-- Barra de edición -->
<div class="barra-edicion" id="controles-edicion">
    <button class="btn-edicion btn-borrar" id="btnBorrar" onclick="toggleModoBorrar()">
        <span class="icono">🗑️</span>
        <span>Borrar</span>
    </button>
    <button class="btn-edicion btn-guardar" id="btnGuardar" onclick="guardarEnHistorial()">
        <span class="icono">💾</span>
        <span>Guardar</span>
    </button>
    <button class="btn-edicion btn-editar" id="btnEditar" onclick="desbloquearCartones()" style="display:none;">
        <span class="icono">🔓</span>
        <span>Editar</span>
    </button>
    <button class="btn-edicion btn-limpiar" onclick="limpiarTodo()">
        <span class="icono">🧹</span>
        <span>Limpiar</span>
    </button>
</div>

    <div class="info-guardado" id="infoGuardado"></div>

    <div id="contenedor-cartones"></div>

    <div class="info" id="infoTexto">Los cartones se guardan en la nube automáticamente.</div>

    <!-- Overlay Teclado -->
    <div class="overlay" id="overlay">
        <div class="teclado">
            <h3 id="teclado-titulo">Ingresa el número</h3>
            <div class="display" id="teclado-display">--</div>
            <div class="botones-num" id="teclado-botones"></div>
            <div class="acciones">
                <button class="btn-cancelar" onclick="cancelarEdicion()">Cancelar</button>
                <button class="btn-aceptar" onclick="confirmarEdicion()">Aceptar</button>
            </div>
        </div>
    </div>

    <!-- Modal Historial -->
    <div class="modal-historial" id="modalHistorial">
        <div class="historial-contenido">
            <h3>📂 Cartones Guardados</h3>
            <div id="listaHistorial"></div>
            <button class="btn btn-limpiar" style="width:100%; margin-top:15px;" onclick="cerrarHistorial()">Cerrar</button>
        </div>
    </div>

</div>
<!-- ========== FIN VISTA CARTÓN ========== -->

<!-- ========== VISTA: TÓMBOLA ========== -->
<div id="vista-tombola" class="vista oculto">
    <div class="tombola-panel">
        <div class="sala-panel">
            <div class="sala-info">
                <span class="sala-label">Sala:</span>
                <span class="sala-codigo" id="salaCodigo" onclick="copiarCodigoSala()" title="Toca para copiar">-----</span>
                <span class="badge-conexion" id="badgeConexion" title="Conectando...">🔴</span>
            </div>
            <button class="btn-sala" onclick="cambiarSala()">🔁 Cambiar sala</button>
        </div>

        <button class="btn-ver-partidas" onclick="abrirPantallaGrande()">🖥️ Abrir pantalla grande (TV o notebook)</button>

        <div class="bola-zona">
            <div class="fila-voz">
                <button class="btn-voz" id="btnVoz" onclick="toggleVoz()" title="Activar/desactivar voz">🔊</button>
            </div>
            <div class="bola bola-vacia" id="bola">?</div>
            <div class="stats-tombola">
                <span>Salidos: <strong id="statSalidos">0</strong></span>
                <span>Quedan: <strong id="statRestantes">90</strong></span>
            </div>
        </div>

        <div class="btns-tombola">
            <button class="btn-sacar" id="btnSacar" onclick="sacarNumero()">🎲 Sacar número</button>
            <button class="btn-deshacer" id="btnDeshacer" onclick="deshacerUltimo()">↩️ Deshacer</button>
            <button class="btn-reiniciar" onclick="reiniciarTombola()">🔄 Reiniciar</button>
        </div>

        <div class="seccion-titulo">Tablero (1-90)</div>
        <div class="tablero-tombola" id="tableroTombola"></div>

        <div class="seccion-titulo">Números salidos</div>
        <div class="lista-salidos" id="listaSalidos"></div>

        <button class="btn-ver-partidas" onclick="abrirPartidas()">📜 Ver partidas anteriores</button>
    </div>
</div>
<!-- ========== FIN VISTA TÓMBOLA ========== -->

<!-- Modal Partidas anteriores de la tómbola (fuera de ambas vistas, para que
     no quede oculto cuando la vista de Cartón se esconde con display:none) -->
<div class="modal-historial" id="modalPartidas">
    <div class="historial-contenido">
        <h3>📜 Partidas Anteriores</h3>
        <div id="listaPartidas"></div>
        <button class="btn btn-limpiar" style="width:100%; margin-top:15px;" onclick="cerrarPartidas()">Cerrar</button>
    </div>
</div>

    <!-- Conexión con Firebase (historial de cartones y tómbola en vivo) -->
    <script type="module" src="js/firebase-config.js"></script>

    <!-- Lógica de la app (scripts clásicos, comparten variables globales) -->
    <script src="js/carton.js"></script>
    <script src="js/historial.js"></script>
    <script src="js/tombola.js"></script>
    <script src="js/partidas.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
